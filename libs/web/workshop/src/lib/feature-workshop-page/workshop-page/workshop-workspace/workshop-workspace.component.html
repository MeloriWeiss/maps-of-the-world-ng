<wm-workshop-canvas></wm-workshop-canvas>

<div class="workspace-status">
  <div class="workspace-status__zoom">
    <span aria-hidden="true">⌕</span>
    <input
      type="range"
      min="0"
      max="100"
      step="0.5"
      [ngModel]="zoomSliderPosition()"
      (ngModelChange)="updateZoomSlider($event)"
      aria-label="Масштаб"
    />
    <output>{{ zoomPercent() }}%</output>
    <button type="button" (click)="fitWorld()">Весь мир</button>
  </div>

  <label class="workspace-status__grid">
    <input
      type="checkbox"
      [checked]="showGrid()"
      (change)="toggleGrid($event)"
    />
    Показать сетку
  </label>
</div>
