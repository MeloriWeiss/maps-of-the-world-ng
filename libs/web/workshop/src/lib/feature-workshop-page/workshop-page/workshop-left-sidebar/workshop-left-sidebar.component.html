<button
  class="sidebar-toggle"
  type="button"
  [attr.aria-label]="collapsed() ? 'Открыть инструменты' : 'Скрыть инструменты'"
  (click)="toggleSidebar($event)"
>
  {{ collapsed() ? '›' : '‹' }}
</button>

<div class="tools-list">
  @for (tool of tools; track tool.name) {
    <button
      class="btn tool-btn"
      type="button"
      [class.selected]="currentToolName() === tool.name"
      [attr.aria-label]="tool.label"
      [title]="tool.label"
      (click)="setCurrentTool(tool.name)"
      (contextmenu)="openContextMenu($event, tool)"
    >
      <svg [icon]="tool.icon" dir="workshop/" class="svg35"></svg>
    </button>
  }
</div>

@if (contextMenu; as menu) {
  <div
    class="tool-context-menu"
    role="dialog"
    aria-label="Настройки инструмента"
    [style.left.px]="menu.x"
    [style.top.px]="menu.y"
    (mousedown)="$event.stopPropagation()"
    (contextmenu)="$event.preventDefault()"
  >
    <div class="tool-context-menu__title">
      <span>{{
        menu.tool === WorkshopTools.TEXTURE ? 'Текстура' : 'Кисть'
      }}</span>
      <button type="button" (click)="closeContextMenu()">×</button>
    </div>

    <div class="tool-context-menu__tabs" aria-hidden="true">
      <span class="active">●</span>
      <span>▦</span>
      <span>✳</span>
      <span>□</span>
      <span>○</span>
      <span>⬠</span>
    </div>

    <div class="tool-context-menu__content">
      <label class="tool-context-menu__field">
        <span>Толщина линии</span>
        <div class="tool-context-menu__range">
          <input
            type="range"
            min="1"
            max="40"
            [ngModel]="
              workshopSettingsService.toolStyles[menu.tool].strokeWidth
            "
            (ngModelChange)="updateStrokeWidth(menu.tool, $event)"
          />
          <output>{{
            workshopSettingsService.toolStyles[menu.tool].strokeWidth
          }}</output>
        </div>
      </label>

      <label class="tool-context-menu__field">
        <span>
          Непрозрачность:
          {{
            workshopSettingsService.shapeStyle.opacity * 100 | number: '1.0-0'
          }}
        </span>
        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          [ngModel]="workshopSettingsService.shapeStyle.opacity"
          (ngModelChange)="updateOpacity($event)"
        />
      </label>

      <label class="tool-context-menu__field tool-context-menu__color">
        <span>Цвет линии</span>
        <input
          type="color"
          [ngModel]="workshopSettingsService.toolStyles[menu.tool].strokeColor"
          (ngModelChange)="updateStrokeColor(menu.tool, $event)"
        />
      </label>

      <label class="tool-context-menu__field tool-context-menu__color">
        <span>Заливка</span>
        <input
          type="color"
          [ngModel]="workshopSettingsService.toolStyles[menu.tool].fillColor"
          (ngModelChange)="updateFillColor(menu.tool, $event)"
        />
      </label>

      @if (menu.tool === WorkshopTools.TEXTURE) {
        <div class="texture-preview" aria-label="Предпросмотр текстуры"></div>

        <label class="tool-context-menu__field">
          <span>
            Масштаб текстуры:
            {{ workshopSettingsService.textureStyle.textureScale }}
          </span>
          <input
            type="range"
            min="0.25"
            max="4"
            step="0.05"
            [ngModel]="workshopSettingsService.textureStyle.textureScale"
            (ngModelChange)="updateTextureScale($event)"
          />
        </label>

        <label class="tool-context-menu__field">
          <span>
            Поворот:
            {{ workshopSettingsService.textureStyle.textureRotation }}°
          </span>
          <input
            type="range"
            min="0"
            max="360"
            step="1"
            [ngModel]="workshopSettingsService.textureStyle.textureRotation"
            (ngModelChange)="updateTextureRotation($event)"
          />
        </label>
      }
    </div>
  </div>
}
