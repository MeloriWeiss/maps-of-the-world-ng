<button
  class="right-sidebar-toggle"
  type="button"
  [attr.aria-label]="
    collapsed() ? 'Открыть боковую панель' : 'Скрыть боковую панель'
  "
  (click)="toggleSidebar()"
>
  {{ collapsed() ? '‹' : '›' }}
</button>

<div class="layers">
  <section class="objects-pane">
    <div class="pane-title">
      <span>›</span>
      <strong>Объекты</strong>
    </div>
    <div class="objects-pane__body">
      <label class="objects-search">
        <span>⌕</span>
        <input type="search" placeholder="Поиск" />
      </label>
      <p>На этой карте нет Объектов.</p>
    </div>
  </section>

  <section class="layer-pane">
    <div class="layers__header">
      <span class="layers__title">› &nbsp; Слои</span>
      <div class="layers__actions">
        <button
          type="button"
          class="layers__add layers__add--group"
          (click)="toggleMode()"
          title="Добавить группу"
        >
          M
        </button>
        <button
          type="button"
          class="layers__add layers__add--group"
          (click)="generateTestData()"
          title="Сгенерировать фигуры"
        >
          Gen
        </button>
        <button
          type="button"
          class="layers__add"
          (click)="addLayer()"
          title="Добавить слой"
        >
          + Layer
        </button>
        <button
          type="button"
          class="layers__add layers__add--group"
          (click)="addGroup()"
          title="Добавить группу"
        >
          + Group
        </button>
      </div>
    </div>

    @if (activeNodesList()) {
      <wm-workshop-nodes-panel
        [nodesRoot]="nodesRoot()"
      ></wm-workshop-nodes-panel>
    }

    @if (selectedShape(); as shape) {
      <div class="shape-properties">
        <div class="shape-properties__title">
          Свойства выбранных фигур ({{ selectedShapes().length }})
        </div>

        <label class="shape-properties__field">
          Fill color
          <input
            type="color"
            [ngModel]="
              selectedRectangle?.fillColor ||
              (shape.type === ShapesTypes.TEXT
                ? $any(shape).fillColor
                : '#000000')
            "
            (ngModelChange)="updateSelectedShapesFill($event)"
          />
        </label>

        <label class="shape-properties__field">
          Border color
          <input
            type="color"
            [ngModel]="shape.strokeColor"
            (ngModelChange)="
              updateSelectedShapesProperty('strokeColor', $event)
            "
          />
        </label>

        <label class="shape-properties__field">
          Border width
          <input
            type="number"
            min="0"
            step="1"
            [ngModel]="shape.strokeWidth"
            (ngModelChange)="
              updateSelectedShapesProperty('strokeWidth', $event)
            "
          />
        </label>

        <label class="shape-properties__field">
          Opacity
          <input
            type="number"
            min="0"
            max="1"
            step="0.05"
            [ngModel]="shape.opacity"
            (ngModelChange)="updateSelectedShapesProperty('opacity', $event)"
          />
        </label>

        @if (selectedRectangle; as rectangle) {
          <label class="shape-properties__field">
            Width
            <input
              type="number"
              min="0"
              step="1"
              [ngModel]="rectangle.width"
              (ngModelChange)="rectangle.width = +$event; updateSelectedShape()"
            />
          </label>
          <label class="shape-properties__field">
            Height
            <input
              type="number"
              min="0"
              step="1"
              [ngModel]="rectangle.height"
              (ngModelChange)="
                rectangle.height = +$event; updateSelectedShape()
              "
            />
          </label>
        }

        <label class="shape-properties__field">
          Shadow color
          <input
            type="color"
            [ngModel]="shape.shadowColor || '#000000'"
            (ngModelChange)="
              updateSelectedShapesProperty('shadowColor', $event)
            "
          />
        </label>
        <label class="shape-properties__field">
          Shadow blur
          <input
            type="number"
            min="0"
            step="1"
            [ngModel]="shape.shadowBlur ?? 0"
            (ngModelChange)="updateSelectedShapesProperty('shadowBlur', $event)"
          />
        </label>
        <label class="shape-properties__field">
          Shadow offset X
          <input
            type="number"
            step="1"
            [ngModel]="shape.shadowOffsetX ?? 0"
            (ngModelChange)="
              updateSelectedShapesProperty('shadowOffsetX', $event)
            "
          />
        </label>
        <label class="shape-properties__field">
          Shadow offset Y
          <input
            type="number"
            step="1"
            [ngModel]="shape.shadowOffsetY ?? 0"
            (ngModelChange)="
              updateSelectedShapesProperty('shadowOffsetY', $event)
            "
          />
        </label>
      </div>
    }
  </section>
</div>
