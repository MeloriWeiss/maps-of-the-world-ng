<header class="header">
  <div class="header-left-side">
    <a [routerLink]="['/']" class="linked-block">
      <img src="/assets/imgs/new-logo.png" class="company-logo" alt="Логотип" />
    </a>

    <wm-search-input [formControl]="searchControl">
      <svg icon="search" class="svg20"></svg>
    </wm-search-input>

    <button
      [class.is-active]="isMenuOpen()"
      (click)="toggleMenu()"
      type="button"
      class="burger-button"
    >
      <span class="burger-button__line"></span>
      <span class="burger-button__line"></span>
      <span class="burger-button__line"></span>
    </button>

    <div
      [class.active]="isMenuOpen()"
      (click)="closeMenu()"
      (keydown.escape)="closeMenu()"
      tabindex="0"
      class="menu-overlay"
    ></div>
  </div>

  <div [class.is-open]="isMenuOpen()" class="header-right-side">
    <nav>
      <ul class="header-nav-list">
        <li>
          <a
            [routerLink]="['workshop']"
            routerLinkActive="active"
            class="header-nav-link"
            (click)="closeMenu()"
            >Мастерская</a
          >
        </li>
        <li>
          <a
            [routerLink]="['forum']"
            routerLinkActive="active"
            class="header-nav-link"
            (click)="closeMenu()"
            >Форум</a
          >
        </li>
        <li class="library-nav-item">
          <wm-popover
            #libraryMenu
            alignment="center"
            ariaLabel="Разделы библиотеки"
            routerLinkActive="library-active"
          >
            <button
              wmPopoverTrigger
              type="button"
              class="header-nav-link library-trigger"
              aria-haspopup="menu"
              [attr.aria-expanded]="libraryMenu.isOpen()"
            >
              Библиотека
            </button>

            <nav wmPopoverContent class="library-menu" aria-label="Библиотека">
              <a
                [routerLink]="['maps']"
                routerLinkActive="active"
                role="menuitem"
                (click)="closeMenu()"
              >
                <strong>Карты</strong>
                <span>Миры, созданные сообществом</span>
              </a>
              <a
                [routerLink]="['texture-packs']"
                routerLinkActive="active"
                role="menuitem"
                (click)="closeMenu()"
              >
                <strong>Текстур-паки</strong>
                <span>Наборы материалов для карт</span>
              </a>
              <a
                [routerLink]="['mods']"
                routerLinkActive="active"
                role="menuitem"
                (click)="closeMenu()"
              >
                <strong>Моды</strong>
                <span>Расширения возможностей</span>
              </a>
            </nav>
          </wm-popover>
        </li>
        <li>
          <a
            [routerLink]="['about']"
            routerLinkActive="active"
            class="header-nav-link"
            (click)="closeMenu()"
            >О нас</a
          >
        </li>
      </ul>
    </nav>

    <wm-popover #profileMenu ariaLabel="Меню профиля">
      <button
        wmPopoverTrigger
        type="button"
        class="linked-block avatar-link"
        aria-haspopup="menu"
        [attr.aria-expanded]="profileMenu.isOpen()"
        aria-label="Открыть меню профиля"
      >
        @if (currentAccount.avatarUrl(); as avatarUrl) {
          <img class="avatar-link__image" [src]="avatarUrl" alt="" />
        } @else {
          <svg icon="avatar" class="svg40"></svg>
        }
      </button>

      <nav wmPopoverContent class="profile-menu" aria-label="Профиль">
        <a
          [routerLink]="['profile', 'me']"
          (click)="closeMenu()"
          role="menuitem"
          class="profile-menu__item"
        >
          Профиль
        </a>
        <button
          (click)="logout()"
          type="button"
          role="menuitem"
          class="profile-menu__item profile-menu__item--separated"
        >
          Выйти
        </button>
      </nav>
    </wm-popover>
  </div>
</header>
