<article class="post-block">
  <header class="post-header">
    <div class="user-info">
      <svg icon="avatar" class="svg34 avatar-placeholder"></svg>
      <span class="username">{{ author() }}</span>
    </div>
    <span class="time-ago">{{ createdAt() | dateDiff }}</span>
  </header>

  <div class="post-content">
    <h2 class="post-theme">{{ title() }}</h2>
    <p class="post-body">{{ post() }}</p>
  </div>

  <footer class="post-actions">
    <button
      type="button"
      [class.active]="isLiked()"
      [disabled]="!canLike()"
      [attr.aria-pressed]="isLiked()"
      (click)="likeRequested.emit()"
    >
      <svg [icon]="isLiked() ? 'heart-filled' : 'heart'" class="svg18"></svg>
      {{ likesCount() }}
    </button>
  </footer>
</article>
