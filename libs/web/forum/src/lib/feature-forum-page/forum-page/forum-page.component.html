@if (discussion(); as item) {
  <wm-desk-list
    [pageable]="false"
    [crumbs]="'Все обсуждения > ' + item.category.title + ' > ' + item.title"
  >
    <ng-template #sidebar>
      <wm-forum-sidebar
        [categories]="categories()"
        [selectedCategory]="item.category.slug"
        (createRequested)="newDiscussion()"
      ></wm-forum-sidebar>
    </ng-template>

    <div cards class="forum-content">
      <wm-forum-post
        [title]="item.title"
        [post]="item.post"
        [author]="item.author.nickname"
        [createdAt]="item.createdAt"
        [likesCount]="item.likesCount"
        [isLiked]="item.isLiked"
        [canLike]="isAuthorized() && !isUpdating()"
        (likeRequested)="toggleLike()"
      ></wm-forum-post>

      <wm-comments-section
        [comments]="comments()"
        (commentCreated)="createComment($event)"
      ></wm-comments-section>
    </div>
  </wm-desk-list>
} @else if (hasError()) {
  <wm-error></wm-error>
}
