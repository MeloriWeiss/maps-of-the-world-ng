<div class="forum-sidebar">
  <div class="sidebar-actions">
    <div class="sidebar-mobile">
      <span class="sidebar-active-category">Выберите форум...</span>
      <svg class="svg15" icon="arrow-tailless" />
    </div>

    <button
      class="new-action-btn"
      type="button"
      (click)="createRequested.emit()"
    >
      Новое обсуждение
    </button>
  </div>

  <div class="sidebar">
    <div class="discussions-forums-list-header">
      <span>Форумы</span>
      <span>Темы</span>
    </div>

    <nav>
      <ul class="discussions-forums-list">
        @for (category of categories(); track category.id) {
          <li>
            <a
              [routerLink]="['/forum']"
              [queryParams]="{ category: category.slug, page: 1 }"
              queryParamsHandling="merge"
              [class.active]="selectedCategory() === category.slug"
              class="discussions-forums-btn"
            >
              <span>{{ category.title }}</span>
              <span>{{ category.discussionsCount }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</div>
