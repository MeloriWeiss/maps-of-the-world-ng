<section class="comments__section">
  <p class="comments-section__title">Комментарии:</p>

  <wm-comment-input
    class="comments-section__input"
    placeholder="Оставить комментарий..."
    (submitted)="submit($event)"
  ></wm-comment-input>

  @if (replyTo()) {
    <button class="cancel-reply" type="button" (click)="replyTo.set(null)">
      Отменить ответ
    </button>
  }

  @if (comments()) {
    @for (comment of comments(); track comment.id) {
      <wm-comment
        [comment]="comment"
        [depth]="0"
        (replyRequested)="replyTo.set($event)"
      ></wm-comment>
    }
  }
</section>
